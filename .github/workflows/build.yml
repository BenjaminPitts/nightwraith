name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select validated npm version
        run: npm install --global npm@10.9.4
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Test metrics function
        run: npm test
      - name: Test prerendered production output
        run: npm run test:build
